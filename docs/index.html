<style>
:root{--bg:#f5f0fb;--ink:#2a0f4a;--mute:#5d4a7a;--card:#fff;--line:#dccdf0;--acc:#4b1e86;--onacc:#fff;--gold:#e0a21a;--head:#3b0a6b;--hot:#b8321f;--onhot:#fff;--soft:#ece2f8;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3b0a6b;--ink:#fff;--mute:#cdb8e8;--card:#4e2181;--line:#6b3ba1;--acc:#f7c948;--onacc:#3b0a6b;--gold:#f7c948;--head:#f7c948;--hot:#ff9a85;--onhot:#3b0a6b;--soft:#45177a}}
:root[data-theme="dark"]{--bg:#3b0a6b;--ink:#fff;--mute:#cdb8e8;--card:#4e2181;--line:#6b3ba1;--acc:#f7c948;--onacc:#3b0a6b;--gold:#f7c948;--head:#f7c948;--hot:#ff9a85;--onhot:#3b0a6b;--soft:#45177a}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;flex-direction:column;height:100dvh;max-width:820px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
header b{font:800 20px "League Spartan",Impact,system-ui,sans-serif;text-transform:uppercase;color:var(--head);display:block;line-height:1}
header small{color:var(--mute);font-size:12px}
header .sp{flex:1}
.hb{font:inherit;font-size:13px;font-weight:700;background:var(--soft);color:var(--head);border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
#feed{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.m{display:flex;gap:10px;max-width:100%}
.m.u{justify-content:flex-end}
.av{flex:none;width:34px;height:34px}
.bub{background:var(--card);border:1px solid var(--line);border-radius:4px 20px 20px 20px;padding:12px 16px;max-width:min(92%,640px);white-space:pre-wrap;overflow-wrap:anywhere}
.m.u .bub{background:var(--acc);color:var(--onacc);border-color:var(--acc);border-radius:20px 4px 20px 20px;font-weight:600}
.bub.w{white-space:normal;width:100%;max-width:100%;background:transparent;border:0;padding:0}
.dots i{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}#feed{scroll-behavior:auto}}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-left:44px}
.chip{font:inherit;font-size:14px;font-weight:600;background:var(--card);color:var(--head);border:1.5px solid var(--gold);border-radius:999px;padding:7px 15px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.chip.go{background:var(--gold);color:#2a0f4a;border-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--gold);border-radius:16px;padding:12px 15px;margin:0 0 10px}
.card.urg{border-left-color:var(--hot)}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.card h3{margin:0;font:800 18px/1.15 "League Spartan",system-ui,sans-serif;text-transform:uppercase;color:var(--head)}
.days{font-weight:700;font-size:12px;background:var(--acc);color:var(--onacc);border-radius:999px;padding:2px 11px;white-space:nowrap}
.urg .days{background:var(--hot);color:var(--onhot)}
.meta{font-size:13px;color:var(--mute);margin:2px 0 6px}
.card p{margin:0}.why{margin:7px 0!important;padding:6px 10px;background:var(--soft);border-radius:10px;font-size:14px}
.card small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
a{color:var(--head);font-weight:700}
.stl{display:block;margin-top:7px;font-size:13px;font-weight:600}.stl select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px 8px;margin-left:6px}
#kb{margin:0 16px 8px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
#kb h2{margin:0 0 8px;font:800 18px "League Spartan",system-ui,sans-serif;text-transform:uppercase;color:var(--head)}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.col{background:var(--soft);border-radius:12px;padding:8px 10px}.col h3{margin:0 0 4px;font-size:14px;color:var(--head)}.col p{margin:4px 0;font-size:13px}
.sug{display:flex;gap:8px;overflow-x:auto;padding:4px 16px}.sug .chip{white-space:nowrap;font-size:13px;border-color:var(--line)}
form{display:flex;gap:8px;align-items:flex-end;margin:6px 16px 4px;padding:8px 8px 8px 16px;background:var(--card);border:1.5px solid var(--line);border-radius:26px}
textarea{flex:1;resize:none;border:0;background:transparent;color:var(--ink);font:inherit;max-height:120px;outline:0;padding:6px 0}
form:focus-within{border-color:var(--gold)}
#send{width:42px;height:42px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:20px;font-weight:700;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.foot{font-size:12px;color:var(--mute);text-align:center;padding:2px 16px 10px}
.ck summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--mute);margin-top:6px}.ck label{display:block;font-size:14px;margin:5px 0}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--gold);transition:width .2s}
.met{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.met div{background:var(--soft);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--mute)}.met b{display:block;font:800 24px "League Spartan",system-ui,sans-serif;color:var(--head)}
.alert{border-left:6px solid var(--hot);background:var(--soft);padding:6px 10px;border-radius:10px;margin:0 0 6px;font-size:14px}
.kan2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.col small{color:var(--mute)}
[hidden]{display:none!important}
</style>
</head>

var J={};try{J=JSON.parse(localStorage.getItem("opz_j")||"{}")}catch(e){J={}}

function kk(d){return d.u+"|"+d.t}
function jg(d){return J[kk(d)]||null}
function je(d){var k=kk(d);return J[k]||(J[k]={st:"Acompanhar",ck:[0,0,0,0,0]})}
function nck(e){return e.ck.reduce(function(a,b){return a+(b?1:0)},0)}
function board(){var T=[],steps=0,done=0,al="";D.forEach(function(d){var e=jg(d);if(e){T.push({d:d,e:e});steps+=nck(e);if(e.st==="Concluído")done++}});
T.forEach(function(x){if(x.e.st==="Concluído"||!x.d.fim)return;var dl=days(x.d.fim),n=nck(x.e);

else if(dl<=3)al+='<p class="alert"><b>'+(dl===0?"Vence hoje":"Vence em "+dl+" dia"+(dl>1?"s":""))+':</b> '+esc(x.d.t)+'. Você fez '+n+' de 5 passos.</p>'});
var pct=T.length?Math.round(steps/(T.length*5)*100):0;
$("jb").textContent="Minha jornada ("+T.length+")";
var C={"Acompanhar":[],"A fazer":[],"Fazendo":[],"Concluído":[]};T.forEach(function(x){if(C[x.e.st])C[x.e.st].push(x)});
